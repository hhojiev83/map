<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта сайта и сектора</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1f1f1f;
        }
        .site-badge {
            background-color: #fbc02d;
            color: #000;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            border: 2px solid #ffffff;
            text-align: center;
        }
        .leaflet-popup-content-wrapper {
            background: #2b2b2b;
            color: #fff;
            border-radius: 8px;
            padding: 5px;
        }
        .leaflet-popup-content {
            font-size: 13px;
            line-height: 1.4;
        }
        .leaflet-popup-tip {
            background: #2b2b2b;
        }
        /* Стили для кнопки геолокации */
        .leaflet-control-locate {
            background-color: #2b2b2b !important;
            color: #fff !important;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .leaflet-control-locate:hover {
            background-color: #383838 !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        function getSectorPoints(lat, lon, azimuth, radiusMeters = 120, fov = 60) {
            const rad = Math.PI / 180;
            const R = 6378137;
            let points = [[lat, lon]];

            let startAngle = azimuth - fov / 2;
            let endAngle = azimuth + fov / 2;

            for (let a = startAngle; a <= endAngle; a += 5) {
                let angRad = a * rad;
                let dLat = (radiusMeters * Math.cos(angRad)) / R;
                let dLon = (radiusMeters * Math.sin(angRad)) / (R * Math.cos(lat * rad));
                points.push([lat + dLat * (180 / Math.PI), lon + dLon * (180 / Math.PI)]);
            }

            points.push([lat, lon]);
            return points;
        }

        // Получаем параметры из URL[cite: 18]
        const urlParams = new URLSearchParams(window.location.search);
        const rawData = urlParams.get('data');

        if (!rawData) {
            alert("Данные не переданы!");
        }

        const points = JSON.parse(decodeURIComponent(rawData));
        if (points.length === 0) window.close();

        const target = points[0];
        const map = L.map('map').setView([target.lat, target.lon], 16);

        // Подключаем тайлы Google Карт[cite: 18]
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=ru', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        let azimuths = target.azimuths || [];
        if (azimuths.length === 0 && target.azimuth) {
            azimuths = String(target.azimuth).split('-').map(a => parseInt(a.trim())).filter(n => !isNaN(n));
        }

        const sectorColors = ['#2e7d32', '#1565c0', '#ef6c00', '#7b1fa2'];

        azimuths.forEach((az, index) => {
            let color = sectorColors[index % sectorColors.length];
            let sectorCoords = getSectorPoints(target.lat, target.lon, az, 130, 65);

            L.polygon(sectorCoords, {
                color: color,
                fillColor: color,
                fillOpacity: 0.45,
                weight: 2
            }).addTo(map);
        });

        const customIcon = L.divIcon({
            className: 'custom-site-icon',
            html: `<div class="site-badge">📍 ${target.site_id}</div>`,
            iconSize: [80, 30],
            iconAnchor: [40, 15]
        });

        const marker = L.marker([target.lat, target.lon], { icon: customIcon }).addTo(map);

        const popupContent = `
            <b>🆔 SiteID:</b> ${target.site_id}<br>
            <b>🏢 Nomi:</b> ${target.name || '—'}<br>
            <b>📍 Manzil:</b> ${target.adress || '—'}<br>
            <b>🌐 Koordinata:</b> ${target.lat}, ${target.lon}<br>
            <b>📶 Texnologiya:</b>2G: ${target.g2 || '—'}&nbsp;3G: ${target.g3 || '—'}&nbsp;&nbsp;4G: ${target.g4 || '—'}&nbsp;&nbsp;5G: ${target.g5 || '—'}<br>
            <b>🗼 Machta:</b> ${target.mast_type || '—'}, ${target.mast_hight || '—'}м<br>
            <b>🧭 Azimut:</b> ${target.azimuth || '—'}<br>
            <b>⚙️ BBU:</b> ${target.bbu || '—'}<br>
            <b>🔗 Transport:</b> ${target.transport || '—'}
        `;
        marker.bindPopup(popupContent);

        // ДОБАВЛЕНИЕ КНОПКИ ТЕКУЩЕЙ ПОЗИЦИИ
        const LocateControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                const btn = L.DomUtil.create('button', 'leaflet-control-locate', container);
                btn.innerHTML = '📍';
                btn.title = 'Текущая позиция';

                L.DomEvent.on(btn, 'click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    map.locate({ setView: true, maxZoom: 16 });
                });

                return container;
            }
        });
        map.addControl(new LocateControl());

        let userLocationMarker = null;
        map.on('locationfound', function(e) {
            if (userLocationMarker) {
                map.removeLayer(userLocationMarker);
            }
            userLocationMarker = L.marker(e.latlng, {
                icon: L.divIcon({
                    className: 'custom-site-icon',
                    html: `<div class="site-badge" style="background-color: #0288d1; color: #fff;">📍 Вы здесь</div>`,
                    iconSize: [80, 30],
                    iconAnchor: [40, 15]
                })
            }).addTo(map).bindPopup("Ваше текущее местоположение").openPopup();
        });

        map.on('locationerror', function(e) {
            alert("Не удалось определить геолокацию. Проверьте разрешения устройства.");
        });
    </script>
</body>
</html>
