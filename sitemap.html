<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта сайта и сектора</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1f1f1f;
        }
        .site-label {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            font-family: Arial, sans-serif;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            white-space: nowrap;
        }
        .leaflet-popup-content-wrapper {
            background: #2b2b2b;
            color: #fff;
            border-radius: 8px;
            padding: 5px;
        }
        .leaflet-popup-content {
            font-size: 13px;
            line-height: 1.4;
        }
        .leaflet-popup-tip {
            background: #2b2b2b;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        function getSectorPoints(lat, lon, azimuth, radiusMeters = 120, fov = 60) {
            const rad = Math.PI / 180;
            const R = 6378137;
            let points = [[lat, lon]];

            let startAngle = azimuth - fov / 2;
            let endAngle = azimuth + fov / 2;

            for (let a = startAngle; a <= endAngle; a += 5) {
                let angRad = a * rad;
                let dLat = (radiusMeters * Math.cos(angRad)) / R;
                let dLon = (radiusMeters * Math.sin(angRad)) / (R * Math.cos(lat * rad));
                points.push([lat + dLat * (180 / Math.PI), lon + dLon * (180 / Math.PI)]);
            }

            points.push([lat, lon]);
            return points;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const rawData = urlParams.get('data');

        if (!rawData) {
            alert("Данные не переданы!");
        }

        const points = JSON.parse(decodeURIComponent(rawData));
        if (points.length === 0) window.close();

        const target = points[0];
        const map = L.map('map').setView([target.lat, target.lon], 16);

        // 1. Создаем слои карт
        const streetLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=ru', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        });

        const satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}&hl=ru', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        });

        // Устанавливаем Схему улиц слоем по умолчанию
        streetLayer.addTo(map);

        // Добавляем переключатель слоев в правый верхний угол
        const baseMaps = {
            "🗺️ Схема": streetLayer,
            "🛰️ Спутник": satelliteLayer
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        let azimuths = target.azimuths || [];
        if (azimuths.length === 0 && target.azimuth) {
            azimuths = String(target.azimuth).split('-').map(a => parseInt(a.trim())).filter(n => !isNaN(n));
        }

        const sectorColors = ['#ff7043', '#42a5f5', '#66bb6a', '#ab47bc'];

        azimuths.forEach((az, index) => {
            let color = sectorColors[index % sectorColors.length];
            let sectorCoords = getSectorPoints(target.lat, target.lon, az, 130, 65);
            
            L.polygon(sectorCoords, {
                color: color,
                fillColor: color,
                fillOpacity: 0.45,
                weight: 2
            }).addTo(map);
        });

        // Желтая булавка (пин) на координатах мачты
        const pinIcon = L.divIcon({
            className: 'pin-icon',
            html: `<div style="font-size: 20px; line-height: 20px; text-align: center; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));">📌</div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 20]
        });
        L.marker([target.lat, target.lon], { icon: pinIcon }).addTo(map);

        // Название SiteID рядом
        const labelIcon = L.divIcon({
            className: 'site-label-icon',
            html: `<div class="site-label">${target.site_id}</div>`,
            iconSize: [100, 20],
            iconAnchor: [-10, 15]
        });
        
        const textMarker = L.marker([target.lat, target.lon], { icon: labelIcon }).addTo(map);

        const popupContent = `
            <b>🆔 SiteID:</b> ${target.site_id}<br>
            <b>🏢 Nomi:</b> ${target.name || '—'}<br>
            <b>📍 Manzil:</b> ${target.adress || '—'}<br>
            <b>🌐 Koordinata:</b> ${target.lat}, ${target.lon}<br>
            <b>📶 Texnologiya:</b><br>
            &nbsp;&nbsp;2G: ${target.g2 || '—'}<br>
            &nbsp;&nbsp;3G: ${target.g3 || '—'}<br>
            &nbsp;&nbsp;4G: ${target.g4 || '—'}<br>
            &nbsp;&nbsp;5G: ${target.g5 || '—'}<br>
            <b>🗼 Machta:</b> ${target.mast_type || '—'}, ${target.mast_hight || '—'}м<br>
            <b>🧭 Azimut:</b> ${target.azimuth || '—'}<br>
            <b>⚙️ BBU:</b> ${target.bbu || '—'}<br>
            <b>🔗 Transport:</b> ${target.transport || '—'}
        `;
        
        textMarker.bindPopup(popupContent);
    </script>
</body>
</html>
